site_name: GNU Stow for Mere Mortals
site_description: A plain guide to GNU Stow, the symlink farm manager. Keeping dotfiles and hand-built software in tidy packages and linking them into place, stowing and unstowing cleanly, surviving conflicts, adopting files you already have, and running a stow tree for software you build yourself, with the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/gnu-stow-for-mere-mortals/
copyright: 'Part of <a href="https://paulsullivan33-dev.github.io/mere-mortals/">For Mere Mortals</a> · Text <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>, code MIT'

